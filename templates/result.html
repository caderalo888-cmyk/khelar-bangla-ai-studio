<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title>
<style>body{margin:0;background:#0b1020;color:#f5f7ff;font-family:system-ui,'Noto Sans Bengali',sans-serif}.wrap{max-width:850px;margin:50px auto;padding:22px}.box{background:#141c31;border:1px solid #2a3654;border-radius:16px;padding:24px}pre{white-space:pre-wrap;line-height:1.8;font:inherit;color:#e6ecff}.btn{display:inline-block;background:#58e0a5;color:#08150f;font-weight:800;text-decoration:none;padding:12px 16px;border-radius:10px;margin:8px 8px 0 0}</style></head><body><div class="wrap"><div class="box"><h1>{{title}}</h1><pre>{{content}}</pre>{% if video %}<a class="btn" href="{{url_for('download_output', filename=video)}}">ভিডিও ডাউনলোড</a>{% endif %}<a class="btn" href="{{url_for('index')}}">হোমে ফিরে যাও</a></div></div></body></html>
